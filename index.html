
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공모전 자동 업데이트</title>
<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
}

h1 {
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.card a {
    text-decoration: none;
    color: black;
    font-weight: bold;
}

.card p {
    margin: 5px 0;
    color: #555;
}

.time {
    text-align: center;
    margin-bottom: 20px;
    color: gray;
}
</style>
</head>

<body>

<h1>🔥 오늘의 공모전</h1>
<div class="time">업데이트: 2026-03-26 11:31</div>

<div class="grid">

</div>
</body>
</html>
