
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공모전 자동 업데이트</title>
<style>
body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 20px;
}
.container {
    max-width: 1100px;
    margin: auto;
}
h1 {
    text-align: center;
}
.updated {
    text-align: center;
    color: gray;
    margin-bottom: 20px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}
.card a {
    text-decoration: none;
    color: black;
    font-weight: bold;
}
.meta {
    color: #555;
    font-size: 14px;
    margin-top: 5px;
}
</style>
</head>

<body>
<div class="container">
<h1>🔥 오늘의 공모전</h1>
<div class="updated">업데이트: 2026-03-27 01:13</div>
<div class="grid">

</div>
</div>
</body>
</html>
